name: Release package verification

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build release package
        run: echo "Building release package..."

  diya-gate:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        run: exit 1

      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

  release-deploy:
    runs-on: ubuntu-latest
    needs: diya-gate
    steps:
      - name: Release deploy
        run: echo "Release allowed after Diya"
