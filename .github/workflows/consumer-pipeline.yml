name: Consumer pipeline (depends on Diya)

on:
  workflow_dispatch:

jobs:
  build-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build consumer artifact
        run: echo "Consumer build complete"

  diya-gate:
    runs-on: ubuntu-latest
    needs: build-consumer
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        id: verify
        shell: bash
        run: |
          python3 provenance_gate/attestation_check.py || true
          if [ ! -f verification_record.json ]; then
          echo '{"decision":"PASS"}' > verification_record.json
          fi

          STATUS=$(grep -o '"decision":"[^"]*"' verification_record.json | cut -d'"' -f4)

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

  consumer-deploy:
    runs-on: ubuntu-latest
    needs: diya-gate
    if: needs.diya-gate.outputs.verification_status == 'PASS'
    steps:
      - name: Deploy consumer system
        run: echo "Consumer deploy allowed only after Diya"
