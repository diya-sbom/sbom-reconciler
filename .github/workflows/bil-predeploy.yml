name: BIL pre-deploy receipt

on:
  pull_request:
  workflow_dispatch:

jobs:
  diya-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Diya Gate
        run: |
          echo "Diya running"
          exit 0

  bil_receipt:
    needs: diya-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate BIL receipt
        run: |
          python bil/src/bil.py --intent pre-deploy --artifact README.md --out bil/examples/receipt_ci.json

      - name: Show receipt
        run: |
          cat bil/examples/receipt_ci.json
