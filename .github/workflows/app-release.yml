name: App release verification

on:
  workflow_dispatch:

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Package app
        run: echo "Packaging application artifact..."

  diya-gate:
    runs-on: ubuntu-latest
    needs: package-app
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        run: exit 1

      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

  release-artifact:
    runs-on: ubuntu-latest
    needs: diya-gate
    steps:
      - name: Release artifact
        run: echo "Artifact released only after Diya"
