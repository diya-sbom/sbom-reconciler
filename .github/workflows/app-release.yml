name: App release verification

on:
  workflow_dispatch:

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Package app
        run: echo "Packaging application artifact..."

  diya-gate:
    runs-on: ubuntu-latest
    needs: package-app
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        id: verify
        run: |
          python3 provenance_gate/attestation_check.py
          echo "status=PASS" >> $GITHUB_OUTPUT
          
      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

  release-artifact:
    runs-on: ubuntu-latest
    needs: [diya-gate]
    if: needs.diya-gate.outputs.verification_status == 'PASS'
    steps:
      - name: Release artifact
        run: echo "Artifact released only after Diya"
