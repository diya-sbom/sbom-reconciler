name: SBOM drift check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug SBOM files
        run: |
          echo "=== a_cdx.json ==="
          cat a_cdx.json
          echo "=== b_cdx.json ==="
          cat b_cdx.json

      - name: SBOM diff (CI mode)
        run: python3 src/sbom_diff.py a_cdx.json b_cdx.json

      - name: Show SBOM report (evidence)
        if: always()
        run: |
          echo "SBOM drift check finished"


