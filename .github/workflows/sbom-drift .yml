env:
  DIYA_API_URL: https://example.com

name: SBOM drift check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
 sbom_drift_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug SBOM files
        run: |
          echo "=== a_cdx.json ==="
          cat a_cdx.json
          echo "=== b_cdx.json ==="
          cat b_cdx.json

      - name: SBOM diff (CI mode)
        run: |
          python3 src/sbom_diff.py a_cdx.json b_cdx.json --fail-on-change > drift_report.txt 2>&1
          status=$?
          cat drift_report.txt
          exit $status

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-drift-report
          path: drift_report.txt
    
      - name: Diya Verification Gate
        run: |
          RESPONSE=$(curl -s -X POST "$DIYA_API_URL/verify" \
            -H "Content-Type: application/json" \
            -d '{"artifact":"a_cdx.json","digest":"sha256:test","builder":"github-actions"}')

          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['decision'])")

          if [ "$DECISION" = "FAIL" ]; then
            echo "Diya gate failed"
            exit 1
          fi
