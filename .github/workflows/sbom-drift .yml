name: SBOM drift check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom_drift_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn

      - name: Show repo files
        run: |
          ls -la
          ls -la src || true

      - name: Start Diya API
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 10
          cat uvicorn.log

      - name: Call Diya API
        run: |
          curl http://127.0.0.1:8000 || echo "API not reachable"

          RESPONSE=$(curl -s -X POST http://127.0.0.1:8000/verify \
            -H "Content-Type: application/json" \
            -d '{"baseline":"a_cdx.json","current":"b_cdx.json"}')

          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | python -c "import sys, json; print(json.load(sys.stdin)['decision'])")

          if [ "$DECISION" != "PASS" ]; then
            echo "Diya API failed"
            exit 1
          fi
