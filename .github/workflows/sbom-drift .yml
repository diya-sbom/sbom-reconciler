name: SBOM drift check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom_drift_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn

      - name: Show repo files
        run: |
          ls -la

      - name: Start Diya API
        run: |
          nohup python -m uvicorn api.server:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 10
          cat uvicorn.log

      - name: Call Diya API
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:8000/verify \
            -H "Content-Type: application/json" \
            -d '{"artifact":"a_cdx.json","digest":"sha256:test","builder":"github-actions"}')

          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | python -c "import sys, json; data=json.load(sys.stdin); print(data.get('decision', 'FAIL'))")

          if [ "$DECISION" != "PASS" ]; then
            echo "Diya API failed"
            exit 1
          fi

      - name: Debug SBOM files
        run: |
          echo "=== a_cdx.json ==="
          cat a_cdx.json
          echo "=== b_cdx.json ==="
          cat b_cdx.json

      - name: SBOM diff (CI mode)
        run: |
          python3 src/sbom_diff.py a_cdx.json b_cdx.json --fail-on-change > drift_report.txt
          status=$?
          cat drift_report.txt
          exit $status

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-drift-report
          path: drift_report.txt
