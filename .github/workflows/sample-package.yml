name: Sample package verification

on:
  push:
    paths:
      - "sample/**"
  workflow_dispatch:

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build sample
        run: echo "Building sample package..."

  diya-gate:
    runs-on: ubuntu-latest
    needs: build-sample

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        run: |
          echo "Running Diya Gate on sample..."
          python3 provenance_gate/attestation_check.py

      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

  sample-deploy:
    runs-on: ubuntu-latest
    needs: diya-gate

    steps:
      - name: Deploy sample
        run: echo "Deploy allowed after Diya"
