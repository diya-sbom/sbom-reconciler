name: Diya Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  diya-gate:
    uses: ./.github/workflows/diya-reusable.yml
    secrets: inherit

  protected-job:
    needs: diya-gate
    runs-on: ubuntu-latest
    steps:
      - name: Protected step
        run: echo "Protected job runs only after Diya passes"
