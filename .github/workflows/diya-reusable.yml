name: Diya reusable gate

on:
  workflow_call:
    outputs:
      verification_status:
        description: "PASS or FAIL decision from Verification Record"
        value: ${{ jobs.diya-gate.outputs.verification_status }}

jobs:
  diya-gate:
    runs-on: ubuntu-latest

    outputs:
      verification_status: ${{ steps.verify.outputs.status }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install fastapi uvicorn pydantic pyyaml
          fi

      - name: Start Diya API
        shell: bash
        run: |
         export DIYA_API_KEY="${{ secrets.DIYA_API_KEY }}"
         nohup python3 -m uvicorn api.server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &

         echo "Waiting for API to be ready..."

         for i in {1..30}; do
           if curl -s http://127.0.0.1:8000/health > /dev/null; then
             echo "API is ready"
             break
           fi
           echo "Still waiting..."
           sleep 2
         done

         curl -f http://127.0.0.1:8000/health || (cat server.log && exit 1)

      - name: Diya Gate (enforced)
        shell: bash
        run: |
          chmod +x gate_decision.sh
          ./gate_decision.sh

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json

