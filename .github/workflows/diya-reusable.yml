name: Diya Reusable Workflow

on:
  workflow_call:

jobs:
  diya-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Call Diya API
        id: diya
        run: |
          set -e

          echo "Calling Diya API..."

          RESPONSE=$(curl -s -X POST http://localhost:8000/verify \
            -H "Content-Type: application/json" \
            -d '{
              "artifact": "example-artifact",
              "policy": "default"
            }')

          echo "Full response:"
          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | jq -r '.decision')

          echo "Decision: $DECISION"

          if [ "$DECISION" = "PASS" ]; then
            echo "Diya verification PASSED"
            exit 0
          else
            echo "Diya verification FAILED"
            exit 1
          fi
