name: Diya Reusable Workflow

on:
  workflow_call:

jobs:
  diya-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Diya API
        run: |
          nohup python server.py > server.log 2>&1 &
          sleep 5

      - name: Call Diya API
        run: |
          set -e

          RESPONSE=$(curl -s -X POST http://localhost:8000/verify \
            -H "Content-Type: application/json" \
            -d '{
              "artifact": "example-artifact",
              "policy": "default"
            }')

          echo "Response:"
          echo "$RESPONSE"

          DECISION=$(echo "$RESPONSE" | python -c "import sys, json; print(json.load(sys.stdin)['decision'])")

          echo "Decision: $DECISION"

          if [ "$DECISION" = "PASS" ]; then
            exit 0
          else
            exit 1
          fi
