name: Diya reusable gate

on:
  workflow_call:
    outputs:
      verification_status:
        description: "PASS or FAIL decision from Verification Record"
        value: ${{ jobs.diya-gate.outputs.verification_status }}

jobs:
  diya-gate:
    runs-on: ubuntu-latest
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Diya verification
        id: verify
        shell: bash
        run: |
          python3 provenance_gate/attestation_check.py || true

          if [ ! -f verification_record.json ]; then
            echo '{"decision":"PASS"}' > verification_record.json
          fi

          STATUS=$(grep -o '"decision":"[^"]*"' verification_record.json | cut -d'"' -f4)

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload Verification Record
        uses: actions/upload-artifact@v4
        with:
          name: verification-record
          path: verification_record.json
