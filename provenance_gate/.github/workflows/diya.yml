name: Diya Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  diya-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Diya gate
        run: |
          cd provenance_gate
          chmod +x diya
          ./diya gate

      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: diya-record
          path: provenance_gate/evidence/verification_record.json

  deploy:
    needs: diya-gate
    runs-on: ubuntu-latest
    steps:
      - name: Simulated deploy
        run: echo "Deploy allowed because Diya passed"
