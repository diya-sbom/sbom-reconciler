name: Diya Verify

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Diya verification
        run: |
          python3 cli/diya.py verify

      - name: Verify ledger integrity
        run: |
          python3 cli/diya.py ledger-verify
